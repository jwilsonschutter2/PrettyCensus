<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrettyCensus</title><link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<header><h1>Census Grabber &amp; Mapper</h1><p>Build Census API requests, inspect multi-column presets, and export readable data and maps.</p></header>
<main>
<section class="card"><h2>API Key</h2><div class="row"><input id="APIKey" type="text" placeholder="Census API key"><button id="saveKeyBtn">Save</button></div></section>
<section class="card grid"><label>Year<select id="yearSelect"><option value="">Choose year</option></select></label><label>Dataset<select id="datasetSelect"><option value="">Choose dataset</option><option value="acs/acs5">ACS 5-Year</option><option value="acs/acs1">ACS 1-Year</option><option value="dec/pl">Decennial PL</option><option value="dec/dhc">Decennial DHC</option></select></label><label>Geography<select id="geoLevel"><option value="">Choose geography</option><option value="state">State</option><option value="county">County</option><option value="tract">Tract</option><option value="blockgroup">Block Group</option></select></label><label>State<select id="stateSelect"><option value="">Choose state</option></select></label><label>County<input id="countyInput" type="text" placeholder="3-digit FIPS"></label><label>Tract<input id="tractInput" type="text" value="*"></label><label>Block group<input id="blockGroupInput" type="text" value="*"></label></section>
<section class="card"><h2>Preset Library</h2><p class="hint">Each preset can add multiple Census columns. Edit <code>js/config/preset-library.js</code> to maintain the library.</p><div id="presetDropdown" class="checkbox-dropdown"><button id="presetDropdownToggle" class="checkbox-dropdown__toggle">Select pre-set tables</button><div id="presetDropdownMenu" class="checkbox-dropdown__menu"><div class="toolbar"><input id="tableSearch" type="text" placeholder="Search presets"><button id="presetSelectAll">Select all</button><button id="presetClearAll">Clear</button></div><div id="presetCheckboxList"></div></div></div><label>Custom variable IDs<input id="tableInput" type="text" placeholder="B01003_001E, B25001_001E"></label><p id="selectionSummary" class="hint"></p></section>
<section class="card"><h2>Run</h2><div class="actions"><button id="generateURL">Generate URL</button><button id="fetchJSON">Fetch JSON</button><button id="exportCurrentCsvBtn" disabled>Export CSV</button><button id="mappingOptionBtn">Mapping Option</button></div><textarea id="urlOutput" readonly rows="3"></textarea><div id="jsonTableContainer"></div></section>
<section id="mappingPanel" class="card" hidden><div class="panel-head"><h2>Mapping Option</h2><button id="closeMappingPanelBtn">Close</button></div><div class="grid"><label>Mapbox token<input id="mapboxToken" type="text"></label><label>Variable<select id="mapVariableSelect"><option value="">Choose variable</option></select></label><button id="drawMapBtn">Draw map</button><button id="exportMapGeoJsonBtn" disabled>Export Map GeoJSON</button></div><p id="mapStatus" class="hint"></p><div class="map-shell"><div id="prettyCensusMap"></div><div id="mapLegend" class="map-legend"></div></div></section>
</main><footer>© 2026 James Wilson-Schutter</footer>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script><script src="js/config/preset-library.js"></script><script src="js/config.js"></script><script src="js/geography/geography.js"></script><script src="js/ui/export-labels.js"></script><script src="js/ui/table-renderer.js"></script><script src="js/ui/exports.js"></script><script src="js/ui/dropdowns.js"></script><script src="js/census/census-api.js"></script><script src="js/map/mapping.js"></script><script src="js/app.js"></script></body></html>
